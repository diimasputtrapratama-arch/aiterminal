name: Unzip
on: workflow_dispatch
permissions:
  contents: write
  jobs:
    unzip:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                        - run: |
                                  unzip -q ai-trading-terminal.zip
                                            rm -rf ai-trading-terminal/.github
                                                      cp -r ai-trading-terminal/. .
                                                                rm -rf ai-trading-terminal ai-trading-terminal.zip
                                                                          git config user.name "bot"
                                                                                    git config user.email "bot@users.noreply.github.com"
                                                                                              git add -A
                                                                                                        git commit -m "Extract project"
                                                                                                                  git push